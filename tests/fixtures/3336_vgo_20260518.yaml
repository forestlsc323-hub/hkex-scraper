# ---- 多情境（附录 D-4）：这单是真的有多情境 ----
scenarios:
  multi_scenario: true
  reason: >
    先決條件(3) 允许公司在完成前授出不超过 72,000,000 股奖励股份；
    先決條件(2) 中股份奖励计划受托人对其所持股份作出不可撤销接纳承诺，
    但「上述股份獎勵項下的股份除外」。
    故受托人实际承诺接纳的股数取决于最终授出量，介于
    354,345,774（未授出）与 282,345,774（足额授出 72,000,000）之间。
  page: 7
  quote: "3. 本公司已根據股份獎勵計劃完成向其僱員及其他合資格參與者授出不超過72,000,000股股份"
  note: >
    该情境影响「已承诺接纳股数」，不影响要约最高现金
    （1,905,849,908.60 已按全部要约股份计算，为各情境上限）。
    按附录 D-4「取各情境合计最大者」，主值仍为 1,905,849,908.60。

# ---- 不可撤销承诺（附录 D-5 检测点）----
irrevocable_undertakings:
  exists: true
  page: 7
  quote: "2. 除下文條件(3)所述根據股份獎勵計劃授出的股份獎勵外，股份獎勵計劃的受託人已無條件且不可撤銷地同意並承諾，在收到獨立董事委員會建議接納要約的推薦建議後五個營業日內，其將就股份獎勵計劃項下的所有股份（上述股份獎勵項下的股份除外）接納要約，且股份獎勵計劃受託人已進一步承諾不會撤回該接納"
  reduces_payable: false
  note: >
    与附录 D-5 不同：受托人承诺的是「接纳」而非「不接纳」，
    要约人仍需以现金支付这部分股份，故不产生名义/实付缺口。
    财务资源确认额 1,905,849,908.60 == 要约最高现金，无缺口。
    ⚠️ 但这提高了要约的实际成交确定性，属于交易实质的重要信息，
    抽取时应作为独立字段记录，不可与「名义要约价值」混同。

