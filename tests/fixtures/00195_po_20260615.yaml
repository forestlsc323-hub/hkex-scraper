partial_offer:
  max_shares: 230000000
  max_shares_pct: "16.84"
  is_cap_not_target: true
  page: 4
  quote: "於本公告日期，受要約公司有1,366,000,000股已發行股份。"
  note: >
    ⚠️ PO 与 MGO/VGO 的结构差异：要约股份数是「不超過」的上限，
    并非要约人已持有以外的全部股份。
    1,366,000,000 − 12,664,538（一致行动人）= 1,353,335,462 股在外，
    远大于 230,000,000 的收购上限。
    故 PO 不存在「100% 股本隐含估值 = 已付 + 要约最高现金」这种闭合关系，
    V3 的闭合式必须按要约类型切换，不能套用 MGO/VGO 的公式。
