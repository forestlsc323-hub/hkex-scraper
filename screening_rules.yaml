# ============================================================
# T0 Screening 判定规则
#
# 出处：《港股要约 T0 Screening 作业手册》（你提供）
# 这份文件是分类层的唯一真相源。改规则改这里，然后重跑，
# **不要手改产出的判定结果**。
#
# 铁律二：分类层的错误是静默污染。所以这里的每一条都要能追溯到
# 手册里的哪一段，尤其是那十三个坑。
# ============================================================

version: "screening-2026-08-A"
source: "港股要约 T0 Screening 作业手册"

# ------------------------------------------------------------
# 护栏：这些字**永远不得**出现在排除词里（坑①②）
#
# 坑①：規則3.5公告、確定意圖公告、「可能…要約」、聯合公告 —— 这四个
#       曾被误列进删除清单。前两个是 T0 的法律学名，「可能」是 MGO
#       首次公告的标志性措辞，「聯合公告」是全表频率最高的形式词。
# 坑②：「強制收購」是地雷 —— 想排 squeeze-out，但「強制」是 MGO 的
#       核心特征词，用它当子串会团灭 MGO 的 T0。
#
# 校验分两道：
#
#   1) 裸词护栏：排除词**不得等于**下列任一词。
#      注意是「等于」不是「包含」——「要約結果」「要約結束」含「要約」
#      但它们是合法排除词（名词＋阶段词，坑⑤）。真正的地雷是把裸词
#      「強制」拿去当子串，那会团灭所有 MGO 的 T0。
#
#   2) 语料反测（更强）：排除词不得命中 t0_title_corpus 里的任何一条。
#      这是手册「词表要按真实数据迭代」的机器化版本——
#      新增排除词时，先拿已核实的真实 T0 标题跑一遍，命中就拒绝运行。
# ------------------------------------------------------------
never_exclude_exact:
  - "強制"
  - "自願"
  - "部分"
  - "收購"
  - "要約"
  - "聯合公告"
  - "可能"
  - "規則3.5"
  - "確定意圖"
  - "強制收購"        # 坑②：squeeze-out 想排它，但风险太高，改走人工复核

# 已人工核实的真实 T0 标题。新增排除词必须先过这一关。
# 每加一单核实过的 T0，就往这里加一条 —— 词表的护栏会随样本一起变强。
t0_title_corpus:
  - "聯合公告 (1) 完成出售及購買浦江中國控股有限公司擬出售股份 (2) 由力高證券有限公司為並代表 YOMI.SUN HOLDING LIMITED 就收購浦江中國控股有限公司全部已發行股份作出強制性無條件現金要約 及 (3) 恢復股份買賣"
  - "聯合公告 (1)有關本公司已發行股份總數約27.81%的買賣協議 (2)中信里昂證券有限公司代表藍思科技股份有限公司提出具有前置條件之自願性有條件全面現金要約 (3)藍思科技股份有限公司之須予披露交易 及 (4)復牌"
  - "公告 由華富建業企業融資有限公司代表 YELLOWSTONE INTERNATIONAL LIMITED 提出附帶先決條件的自願現金部分收購要約以收購綠科科技國際有限公司的不超過230,000,000股股份"
  - "根據收購守則規則3.5作出的公告"
  - "有關收購本公司全部已發行股份之確定意圖公告"
  - "聯合公告 - 可能強制性無條件現金要約及恢復買賣"

# 坑⑤：名词中性，动词才带阶段信息。排除词必须「名词＋动词」成对取，
#       单取名词必误杀。下列中性名词不得单独作为排除词。
neutral_nouns_never_alone:
  - "要約"
  - "收購"
  - "股份"
  - "代價"
  - "條件"
  - "文件"
  - "公告"
  - "協議"

# ------------------------------------------------------------
# 第一步：排除层（命中即灰，软删除，不物理删）
# 排除优先于保留 —— 后续公告标题几乎都会把要约全称复述一遍，
# 只跑保留词会大量误留（手册第三步）。
# ------------------------------------------------------------
exclude_terms:
  # 寄发与时限
  - "寄發"
  - "延遲"
  - "延長"
  - "截止"
  # 结果与结算
  - "要約結果"        # 坑③：不用「結果」，太宽
  - "投票結果"
  - "結算"
  - "要約結束"        # 坑③：不用「結束」，太宽
  - "失效"
  - "派付代價"
  - "退款支票"
  # 文件类
  - "綜合文件"
  - "計劃文件"
  - "回應文件"
  # 定期与进展
  - "每月"            # 坑③：覆盖「每月最新資料」「每月最新情況」
  - "月度"            # 坑③：覆盖「月度更新」
  - "更新公告"
  - "每季進展"
  # 接纳进度
  - "接納程度"        # 坑③：不用「接納」，会误伤
  - "接納水平"
  - "成為無條件"
  - "撤回接納"
  # 澄清与变更
  - "澄清"
  - "並無改變"
  - "提高要約價"
  - "修訂要約"
  # 独立意见与会议
  - "獨立財務顧問意見"
  - "獨立財務顧問之建議"
  - "獨立董事委員會函件"
  - "股票過戶登記暫停"
  - "股東特別大會"
  - "法庭會議"
  - "法庭聆訊"
  - "法庭批准"
  - "協議安排生效"

# ------------------------------------------------------------
# 双轨词（坑④）：同一个词两种命运，取决于它是不是独立成篇。
#
#   as_standalone  = 整份公告就讲这件事      → 排除
#   as_bundled     = 作为多编号联合公告的一项 → 不排除（甚至是 T0 强特征）
# ------------------------------------------------------------
dual_track_terms:
  - term: "達成先決條件"
    aliases: ["先決條件之達成", "先決條件的達成", "完成條件的達成"]
    standalone: "exclude"
    bundled: "neutral"
    note: "独立成篇＝后续（绿科、金川、中国数智）；作为 T0 联合公告打包项＝不影响收录（圣牧）"

  - term: "委任獨立財務顧問"
    aliases: ["委任獨立財務顧問"]
    standalone: "exclude"
    bundled: "retain"
    note: "多编号联合公告里＝T0 强特征；单独成篇的一两百 KB 短公告＝T0 后数日的程序公告"

  # 关键词模式下「收購」一个月拉回 113 条，绝大多数是上市规则项下的
  # 普通交易公告（须予披露/主要/关连交易里的收购某某股权），跟收购守则
  # 的要约完全是两回事。实测一周 118 条里 97 条卡在人工桶，就是它们。
  #
  # ⚠️ 但它也会作为 T0 联合公告的一个编号项出现 —— 3336 的标题里就有
  #    「(3)藍思科技股份有限公司之須予披露交易」。所以按坑④ 走双轨：
  #    独立成篇＝上市规则交易公告，排除；作为打包项＝不影响收录。
  - term: "須予披露交易"
    aliases: ["主要交易", "非常重大收購事項", "關連交易", "須予公佈的交易"]
    standalone: "exclude"
    bundled: "neutral"
    note: "上市规则第14/14A章的交易公告，不是收购守则项下的要约；但常作为 T0 联合公告的打包项出现"

# ------------------------------------------------------------
# 第二步：保留层（T0 特征）
# ------------------------------------------------------------
retain_terms:
  # 「恢復買賣」「復牌」不在这里 —— 它们移到 retain_patterns，
  # 并且要求同一标题里另有要约/收购字样。理由见那边的注释。
  - "規則3.5"
  - "確定意圖"
  - "訂立買賣協議"
  - "訂立購股協議"
  - "訂立認購協議"
  - "股份購買協議"
  - "待售股份"
  - "銷售股份"

# 「可能…要約」是 MGO 首次公告的标志性措辞，但两个词中间隔着别的字，
# 不能当固定子串匹配，故单列为正则。
retain_patterns:
  - pattern: "可能.{0,20}要約"
    label: "可能…要約"

  # 坑③ 的同类变体：1417 那条写的是「恢復股份買賣」，不含「恢復買賣」。
  # 固定子串会漏掉它 —— 同类公告不同律所起草，措辞必有变体。
  #
  # ⚠️ 但「復牌／恢復買賣」单独出现时是全市场天天有的普通停复牌公告。
  #    实测一周 4 条留存里 3 条是这种，白下载 3 份 PDF；放到年初至今
  #    就是上百份。PDF 下载是现在最慢的一步，这里每留一条错的都要付钱。
  #    所以要求同一标题里必须另有要约/收购字样 —— 三条已核实的真实
  #    T0 标题全部同时含「要約」，test_resumption_still_retains_real_t0
  #    守着这一点。
  #    前瞻必须锚在串首并配 .* —— 写成 "(?=.*要約)恢復…" 是错的：
  #    前瞻从「恢復」往后看，而「要約」通常在它**前面**（1417、3336 都是），
  #    于是三条真实 T0 全部落空。这个错我自己的测试当场抓到了。
  - pattern: "^(?=.*(?:要約|收購)).*恢復.{0,6}買賣"
    label: "恢復…買賣＋要约字样"
  - pattern: "^(?=.*(?:要約|收購)).*復牌"
    label: "復牌＋要约字样"

  # 坑⑤：动词才带阶段信息。T0 动词（訂立/提出/作出）＋要約 是强特征。
  # 00195 那条 PO 标题只有「提出…部分收購要約」，无任何固定保留词，
  # 靠这条才留得住。排除层先跑，故不会把后续公告误留。
  - pattern: "(?:訂立|提出|作出).{0,40}要約"
    label: "T0动词…要約"

# ------------------------------------------------------------
# 坑⑬：非三种要约的品种 —— 本项目口径下剔除，但必须能一眼分辨，
#       不能和「后续程序公告」混作一堆。单独成桶。
# ------------------------------------------------------------
special_species:
  - name: "協議安排私有化"
    terms: ["協議安排", "計劃安排"]
    note: "公司法 86 条，法庭路径。注意「法庭會議」已在排除层。"
  - name: "回購要約"
    terms: ["回購要約", "購回要約"]
    note: "适用回购守则，非收购守则"
  - name: "清洗豁免"
    terms: ["清洗豁免", "洗滌寬免"]
    note: "获豁免则根本不发要约"
  - name: "規則3.7失效"
    terms: ["諒解備忘錄", "備忘錄失效", "終止商討", "終止磋商"]
    note: "谈崩了，从未到过 T0"

# ⚠️ 坑②后半：「撤銷上市」不得进第一轮排除 ——
#    私有化 T0 标题常含「建議撤銷上市地位」（伟工、储能）。
#    留给人工复核处理。
manual_review_flags:
  - term: "撤銷上市"
    reason: "私有化 T0 常含「建議撤銷上市地位」，不可自动排除（坑②）"
  - term: "強制收購"
    reason: "squeeze-out 挤出程序，但「強制」是 MGO 核心特征词，不可当子串排（坑②）"

# ------------------------------------------------------------
# 第三步的分流：题材相关性闸门
#
# 手册假设输入表已经是「要约相关公告」，所以两层都没命中＝人工逐条看。
# 但我们的输入是**全市场**公告：真跑一次 2026 年至今就是 6993 条，
# 其中盈利警告、翌日披露報表、董事會會議日期这类和要约毫无关系的
# 占了 96%，全塞进人工桶等于把人工桶废掉 —— 该看的十几条淹了。
#
# 所以在第三步再切一刀：标题里连一个要约/收购相关字眼都没有的，
# 归入 irrelevant（不属于本课题），照样软删除、照样进矛盾行自检、
# 照样参与随机抽查。人工桶只留「像是相关但判不了」的。
#
# ⚠️ 这份词表是漏检的直接来源，故加两道机器校验（见 screening.py）：
#   1) t0_title_corpus 里每一条都必须命中至少一个词，否则拒绝运行；
#   2) 命中保留层/双轨保留的行**不经过**这道闸门，闸门只对
#      「什么都没命中」的行生效，方向上只可能少灰、不可能多灰。
# 宁滥勿缺：多留一条进人工桶的代价是多看一眼，漏一条的代价是丢一单。
# ------------------------------------------------------------
offer_domain_terms:
  # 要约与收购本身
  - "要約"
  - "要约"
  - "收購"
  - "收购"
  - "併購"
  - "全面收購"
  - "部分收購"
  - "收購守則"
  - "強制性"
  - "自願性"
  # 私有化与退市路径
  - "私有化"
  - "撤銷上市"
  - "撤回上市"
  - "協議安排"
  - "計劃安排"
  # 控制权变动的前奏（T0 常以这些措辞出现）
  - "控制權"
  - "股權變動"
  - "權益變動"
  - "一致行動"
  - "買賣協議"
  - "購股協議"
  - "認購協議"
  - "股份轉讓"
  - "待售股份"
  - "銷售股份"
  # 豁免与停复牌（要约公告几乎必然伴随停牌）
  - "清洗豁免"
  - "洗滌寬免"
  - "恢復"
  - "復牌"
  - "停牌"
  - "短暫停牌"
  # 英文标题（披露易也有纯英文标题的行）
  - "takeover"
  - "acquisition"
  - "privatis"
  - "privatiz"
  - "mandatory"
  - "unconditional"

# ------------------------------------------------------------
# 坑⑫：标题勘误行成对出现，取修改后、灰取消版
# ------------------------------------------------------------
title_correction_markers:
  superseded: "(取消－標題已被取代及更換)"
  replacement: "(修改後標題)"

# ------------------------------------------------------------
# 坑⑥：两段式 T0 的三个判据（订立 vs 完成 / 「可能」有无 / 復牌有无）
# 坑⑦：回指措辞是照妖镜 —— 需要正文首段，标题层判不了，留给人工/二次筛
# ------------------------------------------------------------
two_stage_discriminators:
  t0_verbs: ["訂立", "提出", "作出", "委任", "成立", "恢復"]
  mid_verbs: ["寄發", "達成", "成為"]
  late_verbs: ["結果", "結算", "派付", "撤銷"]

backreference_patterns:
  - "茲提述"
  - "謹提述"
  - "茲提述本公司日期為"
backreference_note: >
  回指本交易早期公告＝非 T0（天鸽/TRUESENSE、圣牧、创陞、耀才）；
  回指另一单已结束的旧交易＝仍是 T0（万威）。
  只能在拿到正文首段后判，标题层做不了 —— 故此处只做标记，不做判定。

# ------------------------------------------------------------
# 坑⑪：块头只能当旁证，措辞永远是主证
# （RIMBACO 的「寄發綜合文件」有 3MB）
# ------------------------------------------------------------
size_hint:
  t0_typical_kb_min: 500
  procedural_typical_kb_max: 250
  is_evidence: false     # 永不参与自动判定，仅在人工复核报告里显示

# ------------------------------------------------------------
# 第四层防漏网：矛盾行自检
# 在被灰的行里，标题含下列词的必须逐条人工看，防误杀
# ------------------------------------------------------------
contradiction_check_terms:
  - "恢復買賣"
  - "復牌"
  - "委任獨立財務顧問"
  - "訂立"

random_audit_sample_size: 15
random_audit_seed: 20260807      # 固定种子，抽查结果可复现
