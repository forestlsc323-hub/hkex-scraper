# ============================================================
# 阶段一配置：数据源勘察与列表抓取
#
# 改这个文件就能改行为，不要去改 .py 代码。
# 后续阶段（分类/抽取/校验）的配置项会追加到这里。
# ============================================================

paths:
  data_dir: "data"
  raw_dir: "data/raw"         # raw 表：列表原样存放，不做任何清洗
  cache_dir: "data/cache"     # HTTP 响应缓存，同一 URL 不重复请求
  probe_dir: "data/probe"     # 勘察脚本的产物（HTML/JSON 原样落盘）
  log_dir: "logs"

# 抓取的日期范围（含首尾）
# ⚠️ 第一次跑请先用这个小范围（7 天，约 1 分钟出结果）。
#    确认能连通、能出网页之后，再改成整年重跑。
date_range:
  from: "2026-06-01"
  to: "2026-06-07"

# 整年范围（确认能跑通后，把上面 7 行删掉，换成下面两行）：
#   from: "2026-01-01"
#   to: "2026-08-07"

http:
  # 礼貌爬取：请在 UA 里留下真实联系方式，这是爬公开数据的基本礼貌，
  # 也让对方在你请求过频时能直接联系你而不是直接封 IP。
  user_agent: "hkex-precedent-db/0.1 (research; contact: YOUR_EMAIL_HERE)"

  # 两次"真实网络请求"之间的最小间隔（秒）。命中缓存不计入。
  # 1.5 秒 ≈ 每分钟 40 次，对一个政府背景的公开披露站属于保守水平。
  min_interval_seconds: 1.5

  timeout_seconds: 60

  # 失败重试：仅对网络错误、429、5xx 重试；4xx（除 429）不重试。
  max_retries: 4
  backoff_base_seconds: 2     # 退避间隔 2s, 4s, 8s, 16s

  cache_enabled: true

listing:
  # ----------------------------------------------------------
  # 检索策略照搬实战客户端 hkex_client.py：
  #   · 按**天**抓当日全部公告，不带标题关键词
  #   · 筛选交给 screening 层（词表可迭代，抓取不必重来）
  #
  # 为什么不用标题关键词：关键词漏一个变体就静默漏一单，
  # 而抓全量 + 本地筛，词表改了只要重跑 screening，不用重抓。
  # 单日全市场约 600~800 条，一年约 20 万条，本地筛毫无压力。
  # ----------------------------------------------------------

  # 翻页机制：接口没有 pageNo，靠加大 rowRange 重查 + 按 NEWS_ID 去重。
  # 每轮在上一轮基础上加这个步长。
  #
  # ⚠️ 这个值直接决定耗时。披露易接口没有 offset，翻页靠把「返回上限」
  #    调大后**重新请求一次**，之前的记录会再拉一遍 —— 步长太小就是
  #    平方级浪费。
  #
  #    2026-06-01~07 实测单日条数：1928 / 1337 / 1289 / 1376 / 1045 / 0 / 18。
  #    （原来按「单日 600~800 条」估的，实际是它的两三倍。）
  #
  #      步长  500 → 7 天共 18 次请求，累计拉回约 13000 行，实测约 10 分钟
  #      步长 4000 → 7 天共  7 次请求，累计拉回约  7000 行
  #
  #    rowRange 只是「最多返回多少」，那天只有 18 条就只返回 18 条 ——
  #    把它开大对小日子没有任何代价，所以直接开到能一轮取完。
  #    上限 10000 是服务端硬顶（超过会截断且翻页失效），留足余量取 4000。
  row_range_step: 4000

  # 单日最多重查多少轮的安全阀（4000 × 2 = 8000，仍在服务端上限内）
  max_rounds_per_day: 2

  # 抓取方式：
  #   keyword —— 让披露易在服务端就按标题关键词筛，只把命中的拉回来。
  #              检索页那个「標題」输入框对应的就是 servlet 的 title 参数；
  #              asso 那份客户端一直显式传 title=""（不带关键词＝抓全量），
  #              那个空字符串就是这条路的入口。
  #              一周 6993 条 → 几十条；一年从约 250 次请求降到十几次。
  #   full    —— 把区间内每一天的全部公告拉回来，靠 screening 层自己筛。
  #              慢，但绝对不会漏。
  #
  # 默认走 keyword。万一某个关键词一条都没返回（说明服务端语义和预期
  # 不符），会自动退回 full —— 宁可慢，不可漏。
  # 「抓取」页有个「自检」按钮：同一段日期两种方式各跑一遍，逐条对
  # NEWS_ID，把关键词模式漏掉的列出来。换季度、换年份前跑一次。
  mode: "keyword"

  # 抓回来的公告原件要不要在本地留一份副本。
  #
  #   false（默认）—— 用完即弃，硬盘上什么都不留。asso 那份客户端的
  #                    download_pdf 就是这么做的（`return r.content`）。
  #   true         —— 留一份原件（每份约 700 KB，年初至今约 90 MB）。
  #
  # 为什么默认改成不留还不违背「原始文件永久保留」：
  # 真正撑起审计链的不是 PDF 本身，而是**每个数字出自第几页哪句话**，
  # 那些引文存在 data/store/evidence.json 里，永远留着。
  # 而抽取结果存在 data/store/deals.csv 里并带抽取器版本号，
  # 版本没变就直接复用，连重下都不需要。
  #
  # 界面「抓取」页有「原件副本…」按钮，随时能看占多少、一键删。
  keep_raw_files: false

  # 同一标的的**同一单**交易最多展开几份公告。
  # 一单只有一个 T0，其余是进展/延期/接纳水平之类的后续公告。
  max_per_target: 4

  # 同一家公司的两份公告隔了这么多天，就当成两单不同的交易。
  #
  # 抓一年看不出这条的必要性，抓 2024~2026 就是生死线：不切开的话，
  # 一家公司 2024 年那单的四份公告会把名额全占掉，2026 年那单一份都
  # 打不开，而日志上只显示「跳过 N 份」，看不出丢掉的是一整单交易。
  #
  # 60 天是偏保守的切法：一单要约从 T0 到收官通常三四个月、中间的
  # 进展公告隔几天到几周；而 02362 金川 2026-03 那单 MGO 和 2026-05
  # 那单 PO 隔了 86 天，必须切开。切多了只是多下几份 PDF，
  # 切少了会整单丢掉 —— 代价完全不对等。
  new_deal_gap_days: 60

  # 关键词取并集，命中任一即收。
  # screening_rules.yaml 里那六条已核实的真实 T0 标题必须条条命中至少
  # 一个，测试 test_fast_mode_keywords_cover_every_verified_t0_title 守着。
  title_keywords: ["要約", "收購", "私有化"]

  # 并发段数。按天切成这么多段同时抓，**共用一个全局限速器** ——
  # 目的是让网络往返互相重叠，不是提高对披露易的请求频率。
  # 实测每次请求要 25~35 秒（单日上千条，JSON 包很大），
  # 是延迟受限而不是频率受限，所以并发收益接近线性。
  #
  #   1 段（原来）：7 天约 10 分钟 → 一年约 5 小时
  #   4 段 + 步长 4000：一年约 20~30 分钟
  #
  # 调大之前先想清楚：限速器保证任意两次请求间隔 ≥1 秒，
  # 段数再多也不会超过这个频率，但对方看到的并发连接数会变多。
  max_workers: 4

  # 类别交叉核对用（双保险，不作为主抓取口径）
  category_t1code: "10000"
  category_t2codes: []        # 待 run_probe.py 或 F12 确认收购相关类别代码后填

logging:
  level: "INFO"               # DEBUG 会打印每一次请求的完整参数

# ============================================================
# 校验器阈值
#
# ⚠️ V3~V11 的编号来自附录 D 的「检测点」，但附录 A（判定规则）尚未提供，
#    完整定义与阈值未知。下面是按附录 D 描述的临时实现，
#    附录 A 到手后必须逐条核对，以附录 A 为准。
# ============================================================
validators:
  # 公告里的百分比本身四舍五入到 2 位小数，检验时要放这么多
  pct_rounding_tolerance: 0.005

  # V8：同一份公告里各「每股」口径数字的最大/最小倍数上限。
  # 附录 D-1 中 63.7 与 0.167 相差 381 倍（港元/港仙串单位），应被拦下。
  magnitude_max_ratio: 20

  # V3：分项加总与公告自报总数的允许差额。
  # 默认 0 —— 股数和代价是精确值，对不上就是有问题。
  # 已知存在取整时（如要约价上浮至毫位）须在 fixture 里写明理由后单独放宽。
  closure_tolerance: 0

# ============================================================
# 主值选取口径
#
# ⚠️ 下面这两条是从你给的三单人工答案**反推**出来的，不是附录 A。
#    三单一致不代表规则正确，可能第四单就失效。
#    附录 A 到手后必须逐条核对，届时把 meta.rules_version 填上。
#    验收测试：tests/test_selectors.py（当前 3/3）
# ============================================================
primary_value_rules:
  premium:
    # 取哪个时间窗口的比较基准
    window: "30d"
    # 锚点优先级，靠前的优先。
    # ⚠️ 这一项你自己的两单答案是**相反**的，一条规则解释不了两单：
    #     3336 巨騰   取 -15.45%（未受干扰日前30日），不是 -17.50%（最后交易日）
    #     08439 新百利 取 +40.80%（最后交易日前30日），不是 +129.8%（未受干扰日）
    # 所以这里是个旋钮：默认按下面的顺序（未受干扰日优先，合 3336 与
    # 06808 两单），想改成最后交易日优先就把两个词对调。
    # 不管选哪个，另一个口径都会写进「备注」列，改单笔不用翻原文。
    anchor_priority: ["undisturbed", "last_trading_day", "pre_rule37"]

    # 公告压根没印 30 日均价时，按这个顺序一档档退。
    # 退到哪一档会原样写进「主值口径」列，和数字同列显示 ——
    # 所以这不是静默降级，看表的人一眼知道那个 -4.23% 是 10 日口径。
    #   01833 平安好醫生 答案 -4.23% ← 前10日均价（该单最长只到 10 日）
    #   01980 天鴿互動   答案 +2.10% ← 前5日均价（该单最长只到 5 日）
    # 想完全关掉退档（只认 30 日，其余留空）就写成 []
    window_fallback: ["30d", "10d", "5d", "spot"]

  deal_size:
    # 取「要约项下最高现金代价」，不是控股权转让对价，也不是 100% 股本估值。
    # 1417 你取 5,440万 而非 SPA 的 1.556亿；3336 取 19.06亿 而非 SPA 的 7.34亿。
    candidate_key: "offer_max_cash"
    # ⛔ 未决：公告印出值 vs 复算精确值。
    #    1417 印「約5,440萬」=54,400,000，复算 104,830,000×0.519=54,406,770，
    #    差 6,770（0.0124%）。你的答案取了印出值，故此处暂设 as_printed。
    #    另两单印的就是精确值，无分歧。请确认这是否为正式口径。
    value_basis: "as_printed"

# ============================================================
# PDF 解析
# ============================================================
pdf:
  # 公告 PDF 直接从链接读取，不需要手工下载。
  # 取回的字节会存一份到这里 —— 这是你自己工程要求里的
  #「原始文件永久保留，解析与抽取幂等可重跑」，不是让你手工管理文件。
  cache_dir: "data/cache/pdf"
  max_pages: 0                # 0 = 全部页；要约公告一般 25~30 页，不必限

  # 先翻前这么多页，看看这份文件像不像在讲一单要约；不像就到此为止。
  #
  # 为什么要有这一步：留存桶里绝大多数公告最后的结论是「正文没有
  # 要約價也没有價值比較，不像要约公告」—— 而为了得出这一句话，
  # 原来要把一份一两百页的综合文件从头解析到尾，每份八十多秒。
  #
  # 要约公告的封面必然印着价钱（每股 X.XX 港元）或名目（強制性無條件
  # 現金要約），12 页留足了余量。判据故意放得很松：宁可多解析几份
  # 没用的，也不能漏掉一单。
  #
  # 提前收工这件事**一定会写进那一行的备注**（「只解析了前 12 页」），
  # 不会悄悄发生。觉得判早了就把这个数字调大，或者填 0 关掉。
  probe_pages: 12

  # 一份公告最多允许解析多久，到点**真的**把它掐掉。
  #
  # 这个值原来（MAX_SECONDS_PER_PDF）只被拿去拼了一句「最多再等 90 秒」
  # 显示给用户看，从来没有被执行过 —— Python 没有办法中断一个线程。
  # 于是某份文件让 pdfplumber 陷进去之后，那个线程永远回不来，还攥着
  # 解析锁，后面几十份全部堵死，界面一起冻住。实跑撞上过一次：
  # 日志停在 27/68，界面「未响应」，用户等了一个小时。
  #
  # 现在解析跑在子进程里，超时会真的 terminate 掉它，那一行标成
  # 「解析超时」，剩下的接着跑。碰到 295 页那种大部头想给它更多时间，
  # 调大这个数字就行。
  parse_timeout_seconds: 90

  # 开几个解析子进程。
  #
  # 早先代码里写着「并发解析更慢，实测 4 路比 1 路慢 70%」—— 那是
  # **线程**时代的结论：CPU 型工作受 GIL 限制没法真并行，多开线程只是
  # 把同样的活切碎轮流做。解析搬进子进程之后没有 GIL 了，重测 8 份
  # 60 页的文件：
  #
  #     1 个进程 17.3 秒 ／ 2 个 8.8 秒 ／ 3 个 6.6 秒 ／ 4 个 4.7 秒
  #
  # 接近线性。默认取 2：再多就开始跟你机器上别的程序抢 CPU 和内存
  # （一份 295 页的综合文件解析时能吃掉几百兆），而收益已在递减。
  # 机器闲、想快就调到 3~4；觉得卡就调回 1。
  parse_workers: 2
  timeout_seconds: 180
  # 文本层字符数低于此值即判定为扫描件，走 OCR 并强制人工复核（附录 C 第 9 项）
  min_text_chars: 500
